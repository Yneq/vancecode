[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vancecode"
version = "0.1.0"
description = "A small, explicit coding agent harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vancecode = "vancecode.cli:main"
vancecode-eval = "vancecode.evaluation:main"

[tool.setuptools.packages.find]
include = ["vancecode*"]
